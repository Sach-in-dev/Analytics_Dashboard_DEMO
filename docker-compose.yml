########################################################################
# Analytics Dashboard — DEMO stack.
# Fully isolated from the real project: separate containers, separate
# volume, separate ports (5544 / 6390 / 8010 / 3010), separate database.
# There is no PROD_DB, no Umami, and no Meta Ads credentials anywhere
# in this file — see analytics-api-demo/.env for details.
########################################################################
name: analytics-demo
services:
  db:
    image: postgres:17-alpine
    container_name: bbdemo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo_pw_2026
      POSTGRES_DB: analytics_demo_db
    ports:
      - "5544:5432"
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics_demo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bbdemo-redis
    restart: unless-stopped
    ports:
      - "6390:6379"

  api:
    build:
      context: ./analytics-api-demo
      dockerfile: Dockerfile
    container_name: bbdemo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8010:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=demo_pw_2026
      - DB_NAME=analytics_demo_db
      - ANALYTICS_DB=postgresql://postgres:demo_pw_2026@db:5432/analytics_demo_db
      - PROD_DB=
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=default
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - REDIS_TLS=false
      - TIMEZONE=Asia/Kolkata
      - JWT_SECRET=demo-only-jwt-secret-not-for-production
      - UMAMI_ENDPOINT=
      - UMAMI_USERNAME=
      - UMAMI_PASSWORD=
      - UMAMI_WEBSITE_ID=
      - META_ADS_ACCESS_TOKEN=
      - META_ADS_ACCOUNT_ID=
      - DEMO_MODE=true

  # One-off seeding job — does NOT run with `docker compose up`.
  # Run explicitly after the db is up:
  #   docker compose --profile seed run --rm seed
  seed:
    build:
      context: ./analytics-api-demo
      dockerfile: Dockerfile
    container_name: bbdemo-seed
    profiles: ["seed"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ANALYTICS_DB=postgresql://postgres:demo_pw_2026@db:5432/analytics_demo_db
      - DEMO_MODE=true
    entrypoint: ["python", "seed_demo_data.py"]

  ui:
    build:
      context: ./analytics-ui-demo
      dockerfile: Dockerfile
      args:
        API_URL: "http://api:8000"
    container_name: bbdemo-ui
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3010:3000"
    environment:
      - API_URL=http://api:8000
      - NODE_ENV=production
      - UMAMI_WEBSITE_ID=
      - UMAMI_ENDPOINT=
      - UMAMI_USERNAME=
      - UMAMI_PASSWORD=

volumes:
  demo_pgdata:
